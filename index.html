<script>
const types={creator:{name:'크리에이터',en:'THE CREATOR',kicker:'감각으로 장면을 만드는 사람',emoji:'🎨',headline:'아이디어에 색을 입히는 캠퍼스 아티스트',desc:'남들이 지나치는 디테일까지 자기만의 감각으로 바꿔요. 과제도 일상도 조금 더 예쁘고 새롭게 만드는 재능이 있어요. 당신의 취향은 이미 하나의 포트폴리오!',traits:['감각적인 시선','새로운 발상','디테일에 진심']},social:{name:'분위기 메이커',en:'THE SOCIAL SPARK',kicker:'사람 사이에 온기를 만드는 사람',emoji:'🎤',headline:'어색한 공기를 순식간에 바꾸는 연결왕',desc:'누군가와 함께할 때 에너지가 반짝여요. 먼저 말을 걸고, 웃음을 만들고, 다 같이 편해지는 순간을 잘 알아채는 캠퍼스의 햇살 같은 존재예요.',traits:['친화력 만렙','분위기 감지력','함께라서 더 신남']},multi:{name:'멀티태스커',en:'THE MULTITASKER',kicker:'계획을 현실로 바꾸는 사람',emoji:'⚡',headline:'할 일도 약속도 착착 해내는 실행 대장',desc:'복잡한 상황에서도 우선순위를 세우고 하나씩 움직여요. 막막한 과제는 계획으로, 팀의 아이디어는 결과물로 바꾸는 믿음직한 추진력이 있어요.',traits:['빠른 실행력','일정 관리','믿고 맡기는 타입']},research:{name:'리서처',en:'THE RESEARCHER',kicker:'궁금함을 끝까지 파고드는 사람',emoji:'🔎',headline:'작은 물음표도 놓치지 않는 탐구가',desc:'대충 넘어가기보다 이유와 맥락을 알고 싶어 해요. 꼼꼼하게 비교하고 자료를 찾아보는 습관 덕분에, 모두가 놓친 핵심을 발견하는 일이 많아요.',traits:['호기심 만렙','꼼꼼한 분석','근거를 찾는 편']}};
// choice category order A-D; source question wording and mappings preserved.
const questions=[
{q:'교수님이 “이번 과제는 자유 형식입니다”라고 하셨다.',a:['자유 형식? 이건 내 예술혼을 불태우라는 뜻인가?','교수님이 원하시는 게 뭘까? 일단 평가 기준부터 분석한다.','자유 형식이면 할 게 더 많아지는데? 일단 계획부터 세운다.','발표 형식도 자유인가요? 그럼 제가 한번 찢어보겠습니다.'],m:['creator','research','multi','social']},
{q:'시험 전날, 친구가 “나 공부 하나도 안 했어ㅠㅠ”라고 한다.',a:['“야 나도ㅋㅋ” 일단 같이 웃고 시작한다.','“이것만 외워.” 내가 만든 요약 노트를 보내준다.','“지금부터 하면 돼.” 남은 12시간 벼락치기 플랜을 짜준다.','“근데 이거 왜 이렇게 되는 거야?” 설명하다가 논문까지 찾아본다.'],m:['social','creator','multi','research']},
{q:'공강 3시간. 애매하게 붕 뜬 시간, 나는?',a:['카페 가서 노트북 펼치고 밀린 작업 3개 동시 처리.','학교 주변 예쁜 카페 찾아서 사진 찍고 영감 충전.','친구한테 “뭐해?” 보내고 일단 사람부터 모은다.','평소 궁금했던 거 검색하다가 위키피디아 20번째 탭까지 도달.'],m:['multi','creator','social','research']},
{q:'수업 중 교수님이 “이거 누가 한번 설명해 볼까요?”라고 하신다.',a:['아는 내용이다. 머릿속으로 근거를 정리하고 손을 든다.','정확히는 모르지만 일단 손을 든다. 말하다 보면 답이 나오겠지.','설명할 내용을 머릿속에 도식화하고 있다. 말보다 그림이 빠른데.','아무도 안 나서네. 일단 내가 해보자. 이 침묵을 끝내야 한다.'],m:['research','social','creator','multi']},
{q:'새 학기가 시작됐다. 에브리타임 시간표를 짜는 나의 모습은?',a:['강의평, 교수님 스타일, 과제량까지 조사 완료. 엑셀 켠다.','공강, 알바, 동아리까지 고려한 최적의 시간표 완성.','친한 친구랑 겹치는 수업 있나? 같이 들으면 개꿀.','시간표 색깔부터 맞춘다. 이건 좀 예뻐야 함.'],m:['research','multi','social','creator']},
{q:'새 학기 동아리 모집 시즌! 나의 원픽 동아리는?',a:['포스터부터 인스타 피드까지 감다살! 🎨 디자인·영상 제작 동아리','처음 보는 사람이랑도 3시간 떠들기 가능! 🎤 토론·친목 동아리','기획부터 운영까지 내가 다 해볼게! ⚡ 축제·행사 기획 동아리','궁금한 건 못 참지. 파고들수록 재밌다! 🔎 학술·연구 동아리'],m:['creator','social','multi','research']},
{q:'교수님이 갑자기 “다음 주까지 자기소개 PPT 만들어 오세요”라고 하신다.',a:['발표 첫 멘트부터 고민한다. 일단 웃기게 시작해야지. 🎤','핀터레스트부터 켠다. 내용보다 중요한 건 첫인상이지. 🎨','자기소개, 대본, PPT 제작까지 하루 만에 끝내버린다. ⚡','잘 만든 자기소개 사례부터 찾아본다. 남들은 어떻게 했지? 🔎'],m:['social','creator','multi','research']},
{q:'과제 마감 1시간 전, 갑자기 노트북이 먹통이 됐다.',a:['일단 친구한테 전화한다. “야 나 지금 진짜 망했어ㅋㅋㅋ”','클라우드? USB? 메일? 복구 가능한 방법을 전부 시도한다.','파일이 왜 날아갔지? 오류 메시지 검색해서 원인부터 찾는다.','최악이다. 밤새 맞춘 폰트랑 레이아웃이 다 날아갔다니.'],m:['social','multi','research','creator']},
{q:'팀플 회의가 2시간째 제자리걸음이다. 나의 속마음은?',a:['“그냥 내가 할게.” 이미 할 일 분배하고 있는 중.','“일단 레퍼런스라도 볼까?” 노트북 화면을 공유한다.','“우리 잠깐 쉬었다 할까?” 분위기 환기부터 시도한다.','“말로만 하지 말고 한번 만들어 보자.” 시안 제작 시작.'],m:['multi','research','social','creator']},
{q:'드디어 종강! 성적 확인 버튼을 누르기 직전, 나는?',a:['예상 학점 계산 완료. 장학금 커트라인까지 확인함.','이번 학기 과제물 모아서 포트폴리오 만들 생각 중.','종강 기념 약속 3개 잡고 다음 학기 계획까지 세움.','성적? 일단 친구들이랑 종강 파티부터 갈겨.'],m:['research','creator','multi','social']}
];
let index=0,answers=Array(questions.length).fill(null),resultWinner=null;const $=id=>document.getElementById(id);const quiz=$('quiz'),intro=$('intro'),result=$('result');
function render(){quiz.scrollTop=0;const item=questions[index];$('currentNum').textContent=String(index+1).padStart(2,'0');$('qEyebrow').textContent='QUESTION '+String(index+1).padStart(2,'0');$('progressFill').style.width=((index+1)/questions.length*100)+'%';$('question').textContent=item.q;$('options').innerHTML='';item.a.forEach((text,i)=>{const b=document.createElement('button');b.className='option'+(answers[index]===i?' selected':'');b.setAttribute('aria-pressed',answers[index]===i);b.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><span class="option-text"></span>';b.querySelector('.option-text').textContent=text;b.onclick=()=>{answers[index]=i;render();};$('options').appendChild(b)});$('back').disabled=index===0;$('next').disabled=answers[index]===null;$('next').textContent=index===questions.length-1?'결과 보기 ✦':'다음 질문 →'}
$('start').onclick=()=>{intro.classList.add('hidden');quiz.classList.add('active');render();quiz.scrollTop=0;document.documentElement.scrollTop=0;document.body.scrollTop=0};$('back').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(answers[index]===null)return;if(index<questions.length-1){index++;render()}else showResult()};
function showResult(){const tally={creator:0,social:0,multi:0,research:0},last=[];answers.forEach((a,i)=>{const t=questions[i].m[a];tally[t]++;last.push(t)});const max=Math.max(...Object.values(tally));let winners=Object.keys(tally).filter(t=>tally[t]===max);let winner=null;for(let i=last.length-1;i>=0;i--){if(winners.includes(last[i])){winner=last[i];break}}if(!winner)winner=winners[0];resultWinner=winner;const t=types[winner];$('resultVisual').className='result-visual '+winner;$('resultTypeEn').textContent=t.en;$('resultTitle').textContent=t.name;$('resultKicker').textContent=t.kicker;$('mascot').textContent=t.emoji;$('stamp').textContent='CAMPUS TYPE · '+String(Object.keys(types).indexOf(winner)+1).padStart(2,'0');$('resultHeadline').textContent=t.headline;$('resultDescription').textContent=t.desc;$('traits').innerHTML=t.traits.map(x=>'<span class="trait">#'+x+'</span>').join('');$('scores').innerHTML=Object.entries(types).map(([key,val])=>'<div class="score-title"><span>'+val.name+'</span><span>'+tally[key]+' / 10</span></div><div class="score-track"><i style="width:'+(tally[key]*10)+'%"></i></div>').join('');quiz.classList.remove('active');result.classList.add('active');result.scrollTop=0}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}
function wrap(ctx,text,max){const words=text.split('');let line='',lines=[];for(const ch of words){if(ctx.measureText(line+ch).width>max&&line){lines.push(line);line=ch}else line+=ch}if(line)lines.push(line);return lines}
function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
$('download').onclick=()=>{const win={k:resultWinner,v:types[resultWinner],score:answers.reduce((n,a,i)=>n+(questions[i].m[a]===resultWinner),0)};const {v,score}=win;const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;const c=canvas.getContext('2d');const colors={creator:['#dff2ff','#145acc'],social:['#d6fffa','#087f91'],multi:['#dce9ff','#145acc'],research:['#dcfcfa','#087f91']};const [bg,fg]=colors[win.k];c.fillStyle=bg;c.fillRect(0,0,1080,1350);c.fillStyle=fg;c.font='700 28px Pretendard';c.fillText('✳  대학생 유형 테스트',84,98);c.globalAlpha=.55;c.font='600 24px Pretendard';c.fillText('내 캠퍼스 유형 결과',84,150);c.globalAlpha=1;c.textAlign='center';c.font='220px Pretendard';c.fillText(v.emoji,540,510);c.fillStyle='#ffffff';rounded(c,104,625,872,485,36);c.textAlign='left';c.fillStyle='#6f7890';c.font='600 24px Pretendard';c.fillText(v.en,154,697);c.fillStyle='#142544';c.font='800 66px Pretendard';c.fillText(v.name,154,790);c.fillStyle='#35425b';c.font='600 32px Pretendard';let lines=wrap(c,v.headline,760);lines.slice(0,2).forEach((line,i)=>c.fillText(line,154,855+i*47));c.fillStyle=fg;c.font='700 26px Pretendard';c.fillText(v.traits.map(x=>'#'+x).join('   '),154,1015);c.fillStyle='#6f7890';c.font='600 23px Pretendard';c.fillText('MY TYPE SCORE  '+score+' / 10',154,1065);c.textAlign='center';c.fillStyle=fg;c.globalAlpha=.6;c.font='600 22px Pretendard';c.fillText('10문항 · 4가지 유형',540,1225);c.globalAlpha=1;c.fillStyle='#4b5870';c.font='600 21px Pretendard';c.fillText('내 캠퍼스 캐릭터는 '+v.name,540,1275);const a=document.createElement('a');a.download='campus-type-'+win.k+'.png';a.href=canvas.toDataURL('image/png');a.click();toast('결과 카드를 PNG로 저장했어요!')};
$('again').onclick=()=>{answers=Array(questions.length).fill(null);index=0;result.classList.remove('active');intro.classList.remove('hidden');document.documentElement.scrollTop=0;document.body.scrollTop=0};
</script></body></html>
